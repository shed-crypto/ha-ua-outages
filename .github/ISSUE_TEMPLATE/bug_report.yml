name: Bug Report
description: Report a bug in the ua_outages Home Assistant integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Integration Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "2025.x.x"
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: DTEK Region (site_key)
      options:
        - kem (Kyiv City)
        - krem (Kyiv Region)
        - dnem (Dnipro Region)
        - dem (Donetsk Region)
        - oem (Odesa Region)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Diagnostics
      render: text

